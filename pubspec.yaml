name: craftbook
description: "Offline-first Android app for craft businesses to track orders, manage materials (BOM), and calculate real profit."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  # flutter_quill needs its own localizations delegate for toolbar strings.
  flutter_localizations:
    sdk: flutter

  # UI
  cupertino_icons: ^2.0.0
  fl_chart: ^1.2.0
  # Rich-text order notes. dart_quill_delta is the pure-Dart document model,
  # imported directly by NoteCodec so it stays testable off the widget tree.
  flutter_quill: ^11.6.0
  dart_quill_delta: ^10.0.0

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5

  # Database
  drift: ^2.35.1
  # Raw read-only access for checking a backup before drift opens it.
  sqlite3: ^3.7.0

  # Dependency Injection
  get_it: ^9.3.0

  # Navigation
  go_router: ^18.0.2

  # Utilities
  # 0.20.3 is the floor flutter_localizations pins; flutter_quill allows <0.21.0.
  intl: ^0.20.3
  path_provider: ^2.1.4
  path: ^1.9.0
  file_picker: ^13.1.0
  url_launcher: ^6.3.0
  flutter_markdown_plus: ^1.0.12
  # Product photos: camera capture and the system photo picker.
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.16.1
  drift_dev: ^2.35.1
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/icon/icon_legacy.png
    # The About page renders the repo README, so it can't drift from the docs.
    - README.md

  # Bundled rather than fetched at runtime: the app is offline-first.
  fonts:
    - family: Bricolage
      fonts:
        - asset: assets/fonts/BricolageGrotesque-Medium.ttf
          weight: 500
        - asset: assets/fonts/BricolageGrotesque-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BricolageGrotesque-Bold.ttf
          weight: 700
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans-Bold.ttf
          weight: 700
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon_legacy.png
  adaptive_icon_background: "#F4F5F1"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  adaptive_icon_monochrome: assets/icon/icon_monochrome.png
