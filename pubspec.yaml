name: craftbook
description: "Offline-first Android app for craft businesses to track orders, manage materials (BOM), and calculate real profit."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  fl_chart: ^0.69.0

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Database
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24

  # Dependency Injection
  get_it: ^7.7.0
  injectable: ^2.4.2

  # Navigation
  go_router: ^14.2.7

  # Utilities
  intl: ^0.19.0
  path_provider: ^2.1.4
  path: ^1.9.0
  file_picker: ^8.1.2
  flutter_markdown_plus: ^1.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

  # Code Generation
  build_runner: ^2.4.12
  drift_dev: ^2.20.0
  injectable_generator: ^2.4.2
  bloc_test: ^9.1.7
  mocktail: ^1.0.4
  sqlite3: ^2.9.4
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/icon/icon_legacy.png
    # The About page renders the repo README, so it can't drift from the docs.
    - README.md

  # Bundled rather than fetched at runtime: the app is offline-first.
  fonts:
    - family: Bricolage
      fonts:
        - asset: assets/fonts/BricolageGrotesque-Medium.ttf
          weight: 500
        - asset: assets/fonts/BricolageGrotesque-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BricolageGrotesque-Bold.ttf
          weight: 700
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans-Bold.ttf
          weight: 700
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon_legacy.png
  adaptive_icon_background: "#F4F5F1"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  adaptive_icon_monochrome: assets/icon/icon_monochrome.png
