name: craftbook
description: "Offline-first Android app for craft businesses to track orders, manage materials (BOM), and calculate real profit."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  fl_chart: ^0.69.0

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Database
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24

  # Dependency Injection
  get_it: ^7.7.0
  injectable: ^2.4.2

  # Navigation
  go_router: ^14.2.7

  # Utilities
  intl: ^0.19.0
  path_provider: ^2.1.4
  path: ^1.9.0
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

  # Code Generation
  build_runner: ^2.4.12
  drift_dev: ^2.20.0
  injectable_generator: ^2.4.2
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
